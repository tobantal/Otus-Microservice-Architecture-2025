apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-warehouse-service
  namespace: hw08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-warehouse-service
  template:
    metadata:
      labels:
        app: saga-warehouse-service
    spec:
      containers:
      - name: saga-warehouse-service
        image: tobantal/hw08-saga-warehouse:latest
        ports:
        - containerPort: 8002
        env:
        - name: DB_HOST
          value: "warehouse-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "warehouse_db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "saga"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: saga-warehouse-service
  namespace: hw08
spec:
  selector:
    app: saga-warehouse-service
  ports:
  - port: 8002
