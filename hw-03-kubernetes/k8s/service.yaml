apiVersion: v1
kind: Service
metadata:
  name: helloworld-svc
  labels:
    app: helloworld
spec:
  # ═══════════════════════════════════════════════════════════════════
  # ClusterIP - сервис доступен только внутри кластера
  # ═══════════════════════════════════════════════════════════════════
  # Это default тип. Ingress будет проксировать внешний трафик сюда.
  # Альтернативы:
  #   - NodePort: открывает порт 30000-32767 на всех нодах
  #   - LoadBalancer: создаёт внешний LB (в облаке)
  type: ClusterIP
  
  # ═══════════════════════════════════════════════════════════════════
  # Selector - какие поды обслуживает этот сервис
  # ═══════════════════════════════════════════════════════════════════
  # Service находит все поды с label app=helloworld
  # и балансирует трафик между ними (round-robin)
  selector:
    app: helloworld
  
  # ═══════════════════════════════════════════════════════════════════
  # Ports mapping
  # ═══════════════════════════════════════════════════════════════════
  # port: порт сервиса (на который приходят запросы)
  # targetPort: порт контейнера (куда перенаправляются запросы)
  ports:
    - name: http
      protocol: TCP
      port: 80           # Сервис слушает на 80
      targetPort: 8000   # Контейнер слушает на 8000
