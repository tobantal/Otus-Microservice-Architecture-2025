apiVersion: apps/v1
kind: Deployment
metadata:
  name: idempotent-billing-service
  namespace: hw09
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idempotent-billing-service
  template:
    metadata:
      labels:
        app: idempotent-billing-service
    spec:
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done']
      - name: wait-for-postgres
        image: busybox
        command: ['sh', '-c', 'until nc -z billing-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
      - name: idempotent-billing-service
        image: tobantal/hw09-idempotent-billing:latest
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST
          value: "billing-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "billing_db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: "saga"
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_PASSWORD
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: idempotent-billing-service
  namespace: hw09
spec:
  selector:
    app: idempotent-billing-service
  ports:
  - port: 8001
